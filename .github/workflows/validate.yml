name: validate

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find skills tests -type f -name '*.sh' -print0)

      - name: Check Python syntax
        run: bash tests/check-python-syntax.sh

      - name: Run script regression tests
        run: bash tests/test-maintainer-scripts.sh

      - name: Validate repository contracts
        run: python3 tests/validate_repository.py

      - name: Validate Markdown paths
        run: ./skills/readme-first-maintainer/scripts/check-paths.sh .

      - name: Validate documentation freshness
        run: ./skills/readme-first-maintainer/scripts/check-freshness.sh .
